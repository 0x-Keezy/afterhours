name: poll

# POR QUE UNA CORRIDA LARGA Y NO UN CRON FRECUENTE
#
# Historia medida sobre este repo, tres configuraciones y las tres se cayeron:
#   - `cron: */15`        -> 3 corridas en 6,2 h (una cada 187 min).
#   - `cron: 3 * * * *`   -> 2 disparos en 24 h, los dos ~41 min tarde.
#   - `cron: 7,22,37,52`  -> con el grupo `concurrency` LIBRE durante 76 minutos
#     y CINCO minutos programados de por medio: CERO disparos.
#
# No es la frecuencia (una por hora anduvo igual de mal) y tampoco es el minuto
# congestionado (con minutos raros y el camino despejado no disparo ni una vez).
# Descartado ademas lo barato: el workflow figura `active`, el cron registrado
# es el nuevo, la rama por defecto es `main` y Actions esta habilitado. En toda
# la vida del repo el scheduler disparo DOS veces.
#
# ENTONCES SE DEJA DE APOSTAR A CUANTAS VECES DISPARA Y SE CAMBIA CUANTO CUBRE
# CADA DISPARO. El tope de un job en runners hosted es de 6 horas: con un
# presupuesto de 5,5 h, UNA sola corrida cubre una noche entera tomando una
# lectura por cuarto de hora. Con los ~2 disparos diarios observados la
# cobertura pasa de ~1,5 h/dia a ~11 h/dia, sin infraestructura nueva, sin
# secretos nuevos y sin costo (el repo es publico: minutos gratis).
#
# Los cuatro minutos programados se conservan: son cuatro oportunidades de
# ARRANCAR cobertura en una hora donde la cobertura se corto, y `concurrency`
# descarta los disparos de mas mientras una corrida ya esta leyendo, que es
# exactamente lo que se quiere.
#
# LO QUE ESTO NO ARREGLA, dicho explicito: si el scheduler no dispara NUNCA, no
# hay presupuesto que alcance. El plan B es un disparador independiente (un cron
# de Vercel pegandole a `workflow_dispatch`) y necesita un PAT: es decision del
# duenio del repo, no de este archivo.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # El tope duro de un job hosted es 6 h. El loop se autolimita a 5,5 h de
    # lecturas y el resto queda de aire para el checkout, el npm ci y el
    # ultimo push.
    timeout-minutes: 355
    steps:
      # v5: v4 tiene Node 20, que ya está deprecado y hoy sale como warning en
      # cada corrida. Un warning de deprecación es una falla futura con fecha.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: lecturas alineadas al cuarto de hora
        run: |
          git config user.name  "afterhours-poller"
          git config user.email "poller@users.noreply.github.com"

          # Se lee AHORA y después en cada frontera de cuarto de hora
          # (:00 :15 :30 :45). Alinear al RELOJ —en vez de dormir 900 s desde
          # que arrancó— hace dos cosas: el archivo queda regular aunque el
          # disparo llegue 40 minutos tarde, y dos corridas encadenadas no
          # dejan lecturas a tres minutos una de otra.
          fin=$(( $(date -u +%s) + 330 * 60 ))

          while :; do
            echo "::group::lectura $(date -u +%H:%M:%S)"
            npx tsx src/poller/cli.ts || echo "la lectura falló, sigue la próxima"
            echo "::endgroup::"

            # Se commitea DESPUÉS DE CADA lectura: si el job se corta, lo que
            # alcanzó a leer ya está guardado.
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "data: muestra $(date -u +%FT%TZ)"

              # El push se reintenta: otra corrida encolada puede haber
              # empujado entre medio, y perder una muestra ya leída por una
              # carrera de git sería tirar el único dato que no se puede
              # volver a tomar.
              empujado=no
              for intento in 1 2 3; do
                if git pull --rebase --autostash && git push; then
                  empujado=si
                  break
                fi
                # SIN ESTO EL REINTENTO ES PEOR QUE NADA: un `pull --rebase`
                # que choca deja el arbol a medias, y los intentos 2 y 3
                # corrian sobre un rebase sin resolver. Medido: el job murio
                # entero con las tres lecturas que le quedaban sin tomar.
                git rebase --abort >/dev/null 2>&1 || true
                git merge --abort >/dev/null 2>&1 || true
                echo "push rechazado (intento $intento), reintentando"
                sleep 7
              done
              if [ "$empujado" != si ]; then
                # NO se mata la corrida. La muestra ya esta commiteada localmente
                # y viaja en el push de la lectura siguiente; tirar las lecturas
                # que faltan por una carrera de git seria perder dato que no se
                # puede volver a tomar.
                echo "::warning::push fallido; la muestra queda commiteada y viaja en el proximo intento"
              fi
            fi

            ahora=$(date -u +%s)
            proxima=$(( (ahora / 900 + 1) * 900 ))
            if [ "$proxima" -ge "$fin" ]; then
              echo "presupuesto agotado, termina la corrida"
              break
            fi
            sleep $(( proxima - ahora ))
          done
