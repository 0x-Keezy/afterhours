name: poll

# POR QUE ESTOS MINUTOS Y POR QUE UNA CORRIDA LARGA
#
# Historia medida sobre este repo, tres configuraciones:
#   - `cron: */15`        -> 3 corridas en 6,2 h (una cada 187 min).
#   - `cron: 3 * * * *`   -> 2 disparos en 24 h, los dos ~41 min TARDE.
#   - `cron: 7,22,37,52`  -> 3 disparos en las 10 h siguientes (22:38, 00:34 y
#     04:59 UTC), con atrasos de 1m43s, ~12 min y ~8 min. Cobertura del archivo:
#     de 15 a 27 ranuras de 96 en 24 h.
#
# O sea que el MINUTO si era el problema: los disparos que antes llegaban 41
# minutos tarde ahora llegan casi puntuales. `*/15` cae en :00 :15 :30 :45 y
# `3 * * * *` en :03 — todos en el arranque de hora, el slot congestionado que
# la documentacion de GitHub pide evitar.
#
# ADVERTENCIA DE METODO, porque casi me cuesta el diagnostico: mire durante 76
# minutos con el grupo libre, vi cero disparos y escribi que la hipotesis se
# habia caido. El primer disparo entro SIETE MINUTOS despues de que dejara de
# mirar. Una ventana de una hora no alcanza para medir un scheduler que corre a
# ~1 disparo cada 3 horas.
#
# Y DE AHI SALE EL PRESUPUESTO LARGO. Aun con los minutos buenos, el scheduler
# entrega ~1 disparo cada 3,3 h, no 4 por hora. Con corridas de 45 min eso deja
# el archivo cubierto 2 de cada 10 horas. El tope de un job hosted es de 6 h:
# con un presupuesto de 5,5 h, UNA sola corrida cubre mas que el hueco tipico
# entre disparos, asi que la cobertura pasa a ser practicamente continua. Sin
# infraestructura nueva, sin secretos y sin costo (repo publico: minutos gratis).
#
# Los cuatro minutos programados se conservan: son cuatro oportunidades de
# ARRANCAR cobertura en una hora donde la cobertura se corto, y `concurrency`
# descarta los disparos de mas mientras una corrida ya esta leyendo, que es
# exactamente lo que se quiere.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # El tope duro de un job hosted es 6 h. El loop se autolimita a 5,5 h de
    # lecturas y el resto queda de aire para el checkout, el npm ci y el
    # ultimo push.
    timeout-minutes: 355
    steps:
      # v5: v4 tiene Node 20, que ya está deprecado y hoy sale como warning en
      # cada corrida. Un warning de deprecación es una falla futura con fecha.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: lecturas alineadas al cuarto de hora
        run: |
          git config user.name  "afterhours-poller"
          git config user.email "poller@users.noreply.github.com"

          # Se lee AHORA y después en cada frontera de cuarto de hora
          # (:00 :15 :30 :45). Alinear al RELOJ —en vez de dormir 900 s desde
          # que arrancó— hace dos cosas: el archivo queda regular aunque el
          # disparo llegue 40 minutos tarde, y dos corridas encadenadas no
          # dejan lecturas a tres minutos una de otra.
          fin=$(( $(date -u +%s) + 330 * 60 ))

          while :; do
            echo "::group::lectura $(date -u +%H:%M:%S)"
            npx tsx src/poller/cli.ts || echo "la lectura falló, sigue la próxima"
            echo "::endgroup::"

            # `[skip ci]` NO ES COSMETICO: es lo que evita que el poller
            # agote la cuota de deploys de Vercel.
            #
            # Medido el 2026-09-03, con el sitio ya rate-limiteado ("Deployment
            # rate limited - retry in 24 hours"): CADA push de datos crea un
            # deployment en Vercel. El Ignored Build Step lo cancela a los 2-3
            # segundos, pero **el deployment ya se creo y cuenta**. A cuatro
            # commits por hora eso son ~96 al dia, o sea la cuota diaria entera
            # gastada en builds que se cancelan solos — y entonces un arreglo de
            # codigo de verdad no puede salir.
            #
            # Con `[skip ci]` Vercel no crea el deployment. Es seguro porque el
            # sitio NO necesita redeployarse cuando entra un dato: lee el archivo
            # publicado desde raw.githubusercontent en cada request
            # (`readRecentRemote`, con `revalidate: 60`). Verificado en vivo: la
            # pagina muestra lecturas nuevas sin ningun build de por medio.
            #
            # Y no afecta a este workflow: corre por `schedule`, no por `push`.
            #
            # Se commitea DESPUÉS DE CADA lectura: si el job se corta, lo que
            # alcanzó a leer ya está guardado.
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "data: muestra $(date -u +%FT%TZ) [skip ci]"

              # El push se reintenta: otra corrida encolada puede haber
              # empujado entre medio, y perder una muestra ya leída por una
              # carrera de git sería tirar el único dato que no se puede
              # volver a tomar.
              empujado=no
              for intento in 1 2 3; do
                if git pull --rebase --autostash && git push; then
                  empujado=si
                  break
                fi
                # SIN ESTO EL REINTENTO ES PEOR QUE NADA: un `pull --rebase`
                # que choca deja el arbol a medias, y los intentos 2 y 3
                # corrian sobre un rebase sin resolver. Medido: el job murio
                # entero con las tres lecturas que le quedaban sin tomar.
                git rebase --abort >/dev/null 2>&1 || true
                git merge --abort >/dev/null 2>&1 || true
                echo "push rechazado (intento $intento), reintentando"
                sleep 7
              done
              if [ "$empujado" != si ]; then
                # NO se mata la corrida. La muestra ya esta commiteada localmente
                # y viaja en el push de la lectura siguiente; tirar las lecturas
                # que faltan por una carrera de git seria perder dato que no se
                # puede volver a tomar.
                echo "::warning::push fallido; la muestra queda commiteada y viaja en el proximo intento"
              fi
            fi

            ahora=$(date -u +%s)
            proxima=$(( (ahora / 900 + 1) * 900 ))
            if [ "$proxima" -ge "$fin" ]; then
              echo "presupuesto agotado, termina la corrida"
              break
            fi
            sleep $(( proxima - ahora ))
          done
